services:
- source: /runtime/services/tables.yml
  client_config: {}
  server_config: {}
- source: /runtime/services/anvil/users.yml
  client_config: {allow_signup: true, enable_automatically: true, use_email: true, confirm_email: true, use_google: false, require_secure_passwords: true, allow_remember_me: true, remember_me_days: 30}
  server_config:
    user_table: users
    email_from_address: integracoes@agrocrestani.com.br
    email_content:
      confirm_address: {html: '<p>Obrigado por registrar sua conta conosco. Por favor, clique no link a seguir para confirmar que esta conta é sua:</p><p><br></p><p>{{confirm_link}}</p><p><br></p><p><br></p><p>Obrigado,</p><p><br></p><p>Equipe de TI</p>'}
      reset_password: {html: '<p>Olá,</p><p>Você solicitou a redefinição de senha para a sua conta {{email}}. Para redefinir sua senha, clique no link abaixo:</p><p><br></p><p>{{reset_link}}</p><p><br></p><p>Este link expirará em dez minutos.</p>'}
- source: /runtime/services/google.yml
  client_config: {}
  server_config: {}
- source: /runtime/services/anvil/secrets.yml
  client_config: {}
  server_config: {}
- source: /runtime/services/anvil/email.yml
  client_config: {}
  server_config: {custom_smtp: true, smtp_host: smtp-mail.outlook.com, smtp_port: 587, smtp_encryption: starttls, smtp_user: integracoes@agrocrestani.com.br, smtp_password: SoEH4TntaJWltgASmdYH9KI+OJH4mHfAyMwzIaDK0zTiQ4LIu9Dk8IQHhI3fRUuhtusCKgCIK4TR5Dgvaox16PtDvSLGmU/bNObFs94dZ51DhskogILUaikV3HGNK0zFqxXeDUSrILgSaD+z5boGxL8OjOCeRCFg6+Sy32dqaQGCv8DkYwo=}
startup: {type: form, module: Main}
package_name: Integracoes
allow_embedding: false
name: Integracoes
runtime_options: {version: 2, client_version: '3', server_version: python3-full, server_spec: null}
metadata: {title: Integrações, description: Integrações Crestani, logo_img: 'asset:logoCrestani.jpeg'}
startup_form: null
native_deps: {head_html: ''}
db_schema:
  users:
    client: none
    server: full
    columns:
    - name: email
      admin_ui: {order: 0, width: 200}
      type: string
    - name: enabled
      admin_ui: {order: 1, width: 200}
      type: bool
    - name: last_login
      admin_ui: {order: 2, width: 200}
      type: datetime
    - name: password_hash
      admin_ui: {order: 3, width: 200}
      type: string
    - name: n_password_failures
      admin_ui: {order: 4, width: 200}
      type: number
    - name: confirmed_email
      admin_ui: {order: 5, width: 200}
      type: bool
    - name: signed_up
      admin_ui: {order: 6, width: 200}
      type: datetime
    title: Users
uplink_visible: true
scheduled_tasks: []
